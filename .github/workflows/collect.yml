name: Collect utility status

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:          # "Run workflow" button for an instant refresh

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch public data
        run: node scripts/collect.mjs
      - name: Commit if changed
        run: |
          git config user.name  "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add docs/status.json docs/history.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git pull --rebase --quiet && git push --quiet
